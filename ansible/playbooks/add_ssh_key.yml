---
- name: Add SSH authorized key for user
  hosts: "{{ target_hosts | default('lab') }}"
  become: true
  gather_facts: false
  vars:
    username: "{{ username | default('operador_demo') }}"
    ssh_public_key: "{{ ssh_public_key | default('ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIdemoKey afl-demo') }}"
  tasks:
    - name: Validate supported key type
      ansible.builtin.assert:
        that:
          - ssh_public_key.startswith('ssh-rsa ') or ssh_public_key.startswith('ssh-ed25519 ')
    - name: Ensure .ssh directory exists
      ansible.builtin.file:
        path: "/home/{{ username }}/.ssh"
        state: directory
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0700"
    - name: Ensure key is present
      ansible.builtin.lineinfile:
        path: "/home/{{ username }}/.ssh/authorized_keys"
        line: "{{ ssh_public_key }}"
        create: true
        owner: "{{ username }}"
        group: "{{ username }}"
        mode: "0600"
        state: present
