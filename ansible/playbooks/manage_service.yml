---
- name: Manage allowed service
  hosts: "{{ target_hosts | default('lab') }}"
  become: true
  gather_facts: false
  vars:
    service_name: "{{ service_name | default('nginx') }}"
    requested_service_action: "{{ action | default(state | default('start')) }}"
    desired_state: >-
      {{ 'started' if requested_service_action == 'start'
      else 'stopped' if requested_service_action == 'stop'
      else 'restarted' }}
  tasks:
    - name: Validate service and state
      ansible.builtin.assert:
        that:
          - service_name in ['nginx', 'httpd']
          - requested_service_action in ['start', 'stop', 'restart', 'status']

    - name: Apply service state
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: "{{ desired_state }}"
      when: requested_service_action != 'status'

    - name: Gather services status
      ansible.builtin.service_facts:
      when: requested_service_action == 'status'

    - name: Show service status
      ansible.builtin.debug:
        msg: "Service {{ service_name }} state={{ ansible_facts.services[service_name + '.service'].state | default('unknown') }}"
      when: requested_service_action == 'status'
