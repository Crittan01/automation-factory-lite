version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aflite}
      POSTGRES_USER: ${POSTGRES_USER:-aflite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aflite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aflite}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aflite:aflite@postgres:5432/aflite}
      PYTHONPATH: /workspace/apps/backend:/workspace
    ports:
      - "${BACKEND_PORT:-18010}:8000"
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-13000}:3000"
    volumes:
      - ./:/workspace
    depends_on:
      - backend

volumes:
  pgdata:
