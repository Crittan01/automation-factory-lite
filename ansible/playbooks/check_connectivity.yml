---
- name: Check connectivity
  hosts: "{{ target_hosts | default('lab') }}"
  become: false
  gather_facts: false
  vars:
    connectivity_target: "{{ connectivity_target | default('8.8.8.8') }}"
  tasks:
    - name: Ping target once
      ansible.builtin.command: ping -c 1 -W 2 {{ connectivity_target }}
      changed_when: false
      failed_when: false
      register: connectivity_probe
    - name: Print connectivity probe result
      ansible.builtin.debug:
        msg: "Connectivity rc={{ connectivity_probe.rc }} target={{ connectivity_target }}"
