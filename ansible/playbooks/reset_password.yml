---
- name: Reset password with approved hash format
  hosts: "{{ target_hosts | default('lab') }}"
  become: true
  gather_facts: false
  vars:
    username: "{{ username | default('operador_demo') }}"
    password_hash: "{{ password_hash | default('$6$aflite$demo') }}"
  tasks:
    - name: Validate hash format
      ansible.builtin.assert:
        that:
          - password_hash.startswith('$6$')

    - name: Apply password hash
      ansible.builtin.user:
        name: "{{ username }}"
        password: "{{ password_hash }}"
        update_password: always
