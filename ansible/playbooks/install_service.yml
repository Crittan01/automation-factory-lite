---
- name: Install allowed service
  hosts: "{{ target_hosts | default('lab') }}"
  become: true
  gather_facts: true
  vars:
    service_name: "{{ service_name | default('nginx') }}"
  tasks:
    - name: Validate service name
      ansible.builtin.assert:
        that:
          - service_name in ['nginx', 'httpd']
    - name: Ensure service package is present
      ansible.builtin.package:
        name: "{{ service_name }}"
        state: present
