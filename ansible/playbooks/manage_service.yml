---
- name: Manage allowed service
  hosts: "{{ target_hosts | default('lab') }}"
  become: true
  gather_facts: false
  vars:
    service_name: "{{ service_name | default('nginx') }}"
    service_action: "{{ service_action | default(action | default(state | default('start'))) }}"
    desired_state: "{{ 'started' if service_action == 'start' else 'stopped' if service_action == 'stop' else 'restarted' }}"
  tasks:
    - name: Validate service and state
      ansible.builtin.assert:
        that:
          - service_name in ['nginx', 'httpd']
          - service_action in ['start', 'stop', 'restart', 'status']
    - name: Apply service state
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: "{{ desired_state }}"
      when: service_action != 'status'
    - name: Gather services status
      ansible.builtin.service_facts:
      when: service_action == 'status'
    - name: Show service status
      ansible.builtin.debug:
        msg: "Service {{ service_name }} state={{ ansible_facts.services[service_name + '.service'].state | default('unknown') }}"
      when: service_action == 'status'
